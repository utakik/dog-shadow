<div id="panel">
  <b>犬の影絵 prototype</b><br>
  <label><input type="checkbox" id="alwaysShow"> 常に表示(ジェスチャー判定を無視)</label>
  <label><input type="checkbox" id="showLm" checked> ランドマーク表示</label>
  <label><input type="checkbox" id="mirror" checked> ミラー(自撮り)</label>
  <label>口の最大閉じ角 <input type="range" id="closeMax" min="0" max="40" value="26"> <span id="closeMaxV">26</span>°</label>
  <label>顎ピボットX <input type="range" id="pivX" min="850" max="1200" value="1010"> <span id="pivXV">1010</span></label>
  <label>顎ピボットY <input type="range" id="pivY" min="550" max="850" value="700"> <span id="pivYV">700</span></label>
  <label>スムージング <input type="range" id="smooth" min="0" max="90" value="55"> <span id="smoothV">55</span>%</label>
  <div id="status">カメラ起動中…</div>
</div>
<button id="toggleBtn" onclick="document.getElementById('panel').style.display = document.getElementById('panel').style.display==='none'?'block':'none'">⚙</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
// ============ 対応点(SVG座標 → 手のランドマーク番号) ============
// 手動オーバーレイに基づく: 眼→5, 鼻→12, 耳内→2
const SRC = { eye:[888,376], nose:[383,500], ear:[1223,284] };
const DST_IDS = { eye:5, nose:12, ear:2 };

const video = document.createElement('video');
const canvas = document.getElementById('cam');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const dogRoot = document.getElementById('dogRoot');
const dogBreath = document.getElementById('dogBreath');
const lowerJaw = document.getElementById('lowerJaw');
const upperHead = document.getElementById('upperHead');
const mouthInterior = document.getElementById('mouthInterior');
const tongue = document.getElementById('tongue');
const fangs = [...document.querySelectorAll('[data-layer="fangs"]')];
const statusEl = document.getElementById('status');

const $ = id => document.getElementById(id);
['closeMax','pivX','pivY','smooth'].forEach(id=>{
  $(id).addEventListener('input', ()=> $(id+'V').textContent = $(id).value);
});

let W=1280, H=720;
let prev = null;          // スムージング用の前フレームランドマーク
let dogOpacity = 0;
let prevHandCenter = null;
let prevHandScale = null;
let breathTarget = 0;
let breath = 0;
let mouthOpen = 0;
let barkAmount = 0;
let lickAmount = 0;
let mouthState = 'CLOSED';

const HAND_CENTER_IDS = [0, 5, 9, 13, 17]; // wrist + 4つのMCP
const DOG_BREATH_CENTER = [900, 600];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function updateMouth(openness){
  mouthOpen += (openness - mouthOpen) * 0.22;
  const barkTarget = clamp((mouthOpen - 0.18) / 0.57, 0, 1);
  const lickTarget = clamp((mouthOpen - 0.78) / 0.22, 0, 1);
  barkAmount += (barkTarget - barkAmount) * 0.3;
  lickAmount += (lickTarget - lickAmount) * 0.24;

  // 境界付近でCLOSED/OPEN/LICKが往復しないよう、遷移にヒステリシスを持たせる。
  if (mouthState === 'CLOSED'){
    if (mouthOpen > 0.22) mouthState = 'OPEN';
  } else if (mouthState === 'OPEN'){
    if (mouthOpen < 0.15) mouthState = 'CLOSED';
    else if (lickAmount > 0.58) mouthState = 'LICK';
  } else {
    if (mouthOpen < 0.15) mouthState = 'CLOSED';
    else if (lickAmount < 0.38) mouthState = 'OPEN';
  }

  const closeMax = +$('closeMax').value;
  let tongueOpacity = 0;
  let fangOpacity = 0;
  let interiorOpacity = 0.03;
  let jawAngle = closeMax;

  if (mouthState === 'OPEN'){
    fangOpacity = clamp(barkAmount * 1.35, 0, 1);
    interiorOpacity = clamp(0.2 + barkAmount, 0, 1);
    jawAngle = closeMax * (1 - mouthOpen);
  } else if (mouthState === 'LICK'){
    tongueOpacity = clamp(0.3 + lickAmount, 0, 1);
    interiorOpacity = 0.55;
    jawAngle = closeMax * 0.62; // 舌を出せる程度にだけ開く
  }

  mouthInterior.setAttribute('opacity', interiorOpacity.toFixed(3));
  tongue.setAttribute('opacity', tongueOpacity.toFixed(3));
  tongue.setAttribute('transform',
    mouthState === 'LICK'
      ? `translate(-${(18 + lickAmount*28).toFixed(1)} ${(lickAmount*8).toFixed(1)}) translate(650 760) scale(${(1+lickAmount*0.1).toFixed(3)} ${(1+lickAmount*0.05).toFixed(3)}) translate(-650 -760)`
      : '');
  fangs.forEach(el => el.setAttribute('opacity', fangOpacity.toFixed(3)));
  lowerJaw.setAttribute('transform',
    `rotate(${jawAngle.toFixed(2)}, ${$('pivX').value}, ${$('pivY').value})`);

  return { tongueOpacity, fangOpacity, interiorOpacity, jawAngle };
}

function getHandCenter(pts){
  const sum = HAND_CENTER_IDS.reduce((a, i) => [a[0]+pts[i][0], a[1]+pts[i][1]], [0, 0]);
  return [sum[0]/HAND_CENTER_IDS.length, sum[1]/HAND_CENTER_IDS.length];
}

function getHandScale(pts, center){
  // 手首からmiddle_mcpまでの長さと、MCP群の広がりを併用して安定させる。
  const palmLength = vlen(sub(pts[9], pts[0]));
  const palmSpread = [5, 9, 13, 17]
    .reduce((sum, i) => sum + vlen(sub(pts[i], center)), 0) / 4;
  return palmLength * 0.65 + palmSpread * 0.35;
}

function updateBreath(rawPts, now){
  const handCenter = getHandCenter(rawPts);
  const handScale = getHandScale(rawPts, handCenter);

  if (prevHandCenter && prevHandScale > 1){
    const dy = (prevHandCenter[1] - handCenter[1]) / prevHandScale;
    const ds = (handScale - prevHandScale) / prevHandScale;

    // 大きな移動・拡縮はdogRootに任せ、微細な変化だけを呼吸入力にする。
    const microY = Math.abs(dy) < 0.025 ? dy : 0;
    const microScale = Math.abs(ds) < 0.04 ? ds : 0;
    const instantBreath = clamp(microY * 18 + microScale * 8, -1, 1);
    breathTarget += (instantBreath - breathTarget) * 0.12;
  }

  prevHandCenter = handCenter;
  prevHandScale = handScale;

  // 強いスムージングで手ぶれを低周波信号へ変え、自律呼吸を薄く重ねる。
  breath += (breathTarget - breath) * 0.035;
  const autonomousBreath = Math.sin(now * Math.PI * 2 / 3600) * 0.18;
  const value = clamp(breath + autonomousBreath, -1, 1);
  const scaleX = 1 + value * 0.003;
  const scaleY = 1 + value * 0.009;
  const translateY = -value * 3.5;
  const [cx, cy] = DOG_BREATH_CENTER;
  dogBreath.setAttribute('transform',
    `translate(${cx} ${(cy+translateY).toFixed(3)}) scale(${scaleX.toFixed(5)} ${scaleY.toFixed(5)}) translate(${-cx} ${-cy})`);
  return value;
}

// 2〜3点対応から「回転 + 均一スケール + 平行移動」だけを作る。
// 3点アフィンだと、手の三角形に合わせて犬がせん断・縦横伸びしてしまうため使わない。
function solveSimilarity(src, dst){
  const [sEye, sNose, sEar] = src;
  const [dEye, dNose, dEar] = dst;

  const sv = [sNose[0]-sEye[0], sNose[1]-sEye[1]];
  const dv = [dNose[0]-dEye[0], dNose[1]-dEye[1]];
  const sl = Math.hypot(sv[0], sv[1]);
  const dl = Math.hypot(dv[0], dv[1]);
  if (sl < 1e-6 || dl < 1e-6) return null;

  // nose-eyeを主方向にする。ear-eyeはスケール補助だけに使う。
  const sEarV = [sEar[0]-sEye[0], sEar[1]-sEye[1]];
  const dEarV = [dEar[0]-dEye[0], dEar[1]-dEye[1]];
  const earScale = Math.hypot(dEarV[0], dEarV[1]) / (Math.hypot(sEarV[0], sEarV[1]) + 1e-9);
  const mainScale = dl / sl;
  const scale = mainScale * 0.75 + earScale * 0.25;

  const sa = Math.atan2(sv[1], sv[0]);
  const da = Math.atan2(dv[1], dv[0]);
  const th = da - sa;
  const cos = Math.cos(th) * scale;
  const sin = Math.sin(th) * scale;

  // source eye が destination eye に来るように平行移動
  const e = dEye[0] - (cos*sEye[0] - sin*sEye[1]);
  const f = dEye[1] - (sin*sEye[0] + cos*sEye[1]);

  return [cos, sin, -sin, cos, e, f];
}

const vlen = v => Math.hypot(v[0],v[1]);
const sub = (p,q) => [p[0]-q[0], p[1]-q[1]];
function angleBetween(v1,v2){
  const c = (v1[0]*v2[0]+v1[1]*v2[1]) / (vlen(v1)*vlen(v2) + 1e-9);
  return Math.acos(Math.min(1,Math.max(-1,c))) * 180/Math.PI;
}

function onResults(results){
  ctx.save();
  if ($('mirror').checked){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(results.image, 0, 0, W, H);
  ctx.restore();

  let targetOpacity = 0;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length){
    // ピクセル座標へ(ミラー考慮)
    const mir = $('mirror').checked;
    let pts = results.multiHandLandmarks[0].map(p => [ (mir ? 1-p.x : p.x)*W, p.y*H ]);
    const breathValue = updateBreath(pts, performance.now());

    // スムージング
    const s = 1 - $('smooth').value/100;
    if (prev){ pts = pts.map((p,i)=> [ prev[i][0]+(p[0]-prev[i][0])*s, prev[i][1]+(p[1]-prev[i][1])*s ]); }
    prev = pts;

    // ---- ジェスチャー判定: 親指が指と直交方向に立っている & 人差し指が伸びている ----
    const idxDir = sub(pts[8], pts[5]);
    const thumbDir = sub(pts[4], pts[2]);
    const thumbAng = angleBetween(idxDir, thumbDir);
    const idxExtended = vlen(sub(pts[8],pts[0])) > 1.12 * vlen(sub(pts[5],pts[0]));
    const isDog = (thumbAng > 35 && thumbAng < 125 && idxExtended);
    targetOpacity = ($('alwaysShow').checked || isDog) ? 1 : 0;

    // ---- 口の開き: 人差し指方向と小指方向の開き角 ----
    const pinkyDir = sub(pts[20], pts[17]);
    const spread = angleBetween(idxDir, pinkyDir);          // 開いているほど大
    const openness = Math.min(1, Math.max(0, (spread-10)/(42-10)));
    const mouthView = updateMouth(openness);

    // ---- 均一スケール変換で犬を手に貼り付け ----
    // 3点アフィンではなく similarity transform にすることで、犬の絵が引き伸ばされない。
    const M = solveSimilarity(
      [SRC.eye, SRC.nose, SRC.ear],
      [pts[DST_IDS.eye], pts[DST_IDS.nose], pts[DST_IDS.ear]]
    );
    if (M) dogRoot.setAttribute('transform', `matrix(${M.map(v=>v.toFixed(5)).join(',')})`);

    statusEl.textContent =
      `判定: ${isDog?'🐕 犬!':'—'} / 口:${mouthState}` +
      ` open ${mouthOpen.toFixed(2)} bark ${barkAmount.toFixed(2)} lick ${lickAmount.toFixed(2)}` +
      ` / 舌 ${mouthView.tongueOpacity.toFixed(2)} 牙 ${mouthView.fangOpacity.toFixed(2)}` +
      ` 口内 ${mouthView.interiorOpacity.toFixed(2)} 顎 ${mouthView.jawAngle.toFixed(1)}°` +
      ` / breath ${breathValue.toFixed(3)}`;

    // ランドマーク描画
    if ($('showLm').checked){
      ctx.strokeStyle='rgba(0,255,140,.8)'; ctx.lineWidth=2;
      for (const [a,b] of HAND_CONNECTIONS){
        ctx.beginPath(); ctx.moveTo(...pts[a]); ctx.lineTo(...pts[b]); ctx.stroke();
      }
      ctx.fillStyle='#ff66ff'; ctx.font='11px sans-serif';
      pts.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p[0],p[1],3.5,0,7); ctx.fill(); ctx.fillText(i, p[0]+6, p[1]-4); });
    }
  } else {
    prev = null;
    prevHandCenter = null;
    prevHandScale = null;
    breathTarget *= 0.9;
    mouthOpen *= 0.8;
    barkAmount *= 0.8;
    lickAmount *= 0.8;
    mouthState = 'CLOSED';
    updateMouth(0);
    statusEl.textContent = '手を探しています…';
  }

  // フェード
  dogOpacity += (targetOpacity - dogOpacity) * 0.12;
  dogRoot.setAttribute('opacity', dogOpacity.toFixed(3));
}

const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
hands.onResults(onResults);

navigator.mediaDevices.getUserMedia({
  video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }
}).then(stream=>{
  video.srcObject = stream; video.play();
  video.onloadedmetadata = () => {
    W = video.videoWidth; H = video.videoHeight;
    canvas.width=W; canvas.height=H;
    overlay.setAttribute('viewBox', `0 0 ${W} ${H}`);

    function layout(){
      // 実際のカメラのアスペクト比(W/H)を保ったまま画面に収める
      const fit = Math.min(innerWidth/W, innerHeight/H);
      const wrap = document.getElementById('wrap');
      wrap.style.width = (W*fit)+'px'; wrap.style.height = (H*fit)+'px';
      canvas.style.width = (W*fit)+'px'; canvas.style.height = (H*fit)+'px';
      overlay.style.width = (W*fit)+'px'; overlay.style.height = (H*fit)+'px';
    }
    layout();
    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', ()=> setTimeout(layout, 200));

    const cam = new Camera(video, { onFrame: async()=>{ await hands.send({image:video}); }, width:W, height:H });
    cam.start();
    statusEl.textContent = `カメラOK (${W}x${H})。手をかざしてください`;
  };
}).catch(e=>{ statusEl.textContent = 'カメラエラー: '+e.message+'(https または localhost が必要です)'; });
</script>
